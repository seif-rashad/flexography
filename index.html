<html lang="ar">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ترميم المطبوعات — امتحان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f7f6f3;
  --surface: #ffffff;
  --border: #e2e0da;
  --border-strong: #c8c5bc;
  --text: #1a1916;
  --text-secondary: #6b6860;
  --text-tertiary: #9e9b94;
  --accent: #1a1916;
  --success-bg: #c7f3cb;
  --success-border: #76ab7a;
  --success-text: #2d6e32;
  --danger-bg: #ffd6d3;
  --danger-border: #bd7771;
  --danger-text: #8b2217;
  --mono: 'Cairo', sans-serif;
  --sans: 'Cairo', sans-serif;
}

html { font-size: 16px; direction: rtl; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}

/* Layout */
.site-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 56px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo {
  font-family: var(--sans);
  font-size: 16px;
  font-weight: 500;
  letter-spacing: 0.01em;
  color: var(--text);
  text-decoration: none;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 1.5rem;
}
.header-stat {
  font-size: 14px;
  color: var(--text-tertiary);
  font-family: var(--sans);
}
.header-stat span { color: var(--text); font-weight: 500; }

.main {
  max-width: 780px;
  margin: 0 auto;
  padding: 2.5rem 1.5rem 4rem;
}

/* Start screen */
.start-screen { max-width: 560px; margin: 3rem auto 0; text-align: right; }
.start-screen h1 {
  font-size: 28px;
  font-weight: 500;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
  line-height: 1.2;
}
.start-screen .subtitle {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 2.5rem;
}
.stat-row {
  display:flex;
  flex-direction: row;
  flex-wrap: wrap;
  flex-grow: 1;
  gap: 10px;
  margin-bottom: 2rem;
}
.stat-cell {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem;
  text-align: center;
  flex: 1;
  min-width: 90px;
}

.stat-cell.total {
  flex-grow: 1;
}

.stat-cell .num {
  font-size: 28px;
  font-weight: 500;
  font-family: var(--mono);
  letter-spacing: -0.02em;
  display: block;
  margin-bottom: 2px;
}
.stat-cell .lbl {
  font-size: 11px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.mode-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 1.5rem;
}
.mode-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1.25rem;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;
  text-align: right;
}
.mode-card:hover { border-color: var(--border-strong); }
.mode-card.active {
  border-color: var(--text);
  box-shadow: inset 0 0 0 1px var(--text);
}
.mode-card .mode-title {
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 4px;
}
.mode-card .mode-desc {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
}
.mode-card .mode-icon {
  font-family: var(--mono);
  font-size: 18px;
  margin-bottom: 10px;
  color: var(--text-tertiary);
  text-align: left;
}
.btn-start {
  width: 100%;
  padding: 13px;
  background: var(--text);
  color: var(--bg);
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-family: var(--sans);
  font-weight: 500;
  cursor: pointer;
  letter-spacing: 0.01em;
  transition: opacity 0.15s;
}
.btn-start:hover { opacity: 0.85; }

/* Progress */
.progress-track {
  display: flex;
  gap: 3px;
  flex-wrap: wrap;
  margin-bottom: 2rem;
  direction: ltr; /* keep dots LTR visually if preferred, or RTL. LTR matches standard progress bars */
}
.p-dot {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  background: var(--border);
  cursor: pointer;
  transition: background 0.1s;
  flex-shrink: 0;
}
.p-dot:hover { background: var(--border-strong); }
.p-dot.current { background: var(--text); }
.p-dot.ok { background: var(--success-border); }
.p-dot.bad { background: var(--danger-border); }
.p-dot.skipped { background: #d4c9b0; }

/* Question */
.q-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}
.q-num {
  font-family: var(--sans);
  font-size: 14px;
  color: var(--text-tertiary);
  letter-spacing: 0.04em;
}
.q-section-badge {
  font-size: 12px;
  font-family: var(--sans);
  color: var(--text-tertiary);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 8px;
}
.q-text {
  font-size: 18px;
  font-weight: 500;
  line-height: 1.55;
  letter-spacing: -0.01em;
  margin-bottom: 1.75rem;
  color: var(--text);
}

/* Options */
.options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1.5rem; }
.option {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: border-color 0.12s, background 0.12s;
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
  background: var(--surface);
  text-align: right;
  width: 100%;
  font-family: var(--sans);
}
.option:hover:not(.locked) { border-color: var(--border-strong); background: #fafaf8; }
.option .opt-key {
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 500;
  color: var(--text-tertiary);
  min-width: 14px;
  padding-top: 1px;
}
.option.selected { border-color: var(--text); background: #f7f6f3; }
.option.selected .opt-key { color: var(--text); }
.option.correct { border-color: var(--success-border); background: var(--success-bg); color: var(--success-text); }
.option.correct .opt-key { color: var(--success-text); }
.option.wrong { border-color: var(--danger-border); background: var(--danger-bg); color: var(--danger-text); }
.option.wrong .opt-key { color: var(--danger-text); }
.option.reveal { border-color: var(--success-border); background: var(--success-bg); color: var(--success-text); }
.option.reveal .opt-key { color: var(--success-text); }
.option.locked { cursor: default; }

/* Textarea for Essay */
.textarea-essay {
  resize: vertical;
  min-height: 120px;
  cursor: text;
}
.textarea-essay:focus {
  outline: none;
  border-color: var(--text);
}

/* T/F */
.tf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1.5rem; }
.tf-btn {
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 400;
  font-family: var(--sans);
  color: var(--text);
  background: var(--surface);
  transition: border-color 0.12s, background 0.12s;
  letter-spacing: 0.01em;
}
.tf-btn:hover:not(.locked) { border-color: var(--border-strong); }
.tf-btn.selected { border-color: var(--text); background: #f7f6f3; font-weight: 500; }
.tf-btn.correct { border-color: var(--success-border); background: var(--success-bg); color: var(--success-text); }
.tf-btn.wrong { border-color: var(--danger-border); background: var(--danger-bg); color: var(--danger-text); }
.tf-btn.reveal { border-color: var(--success-border); background: var(--success-bg); color: var(--success-text); }
.tf-btn.locked { cursor: default; }

/* Feedback */
.feedback {
  font-size: 14px;
  padding: 10px 14px;
  border-radius: 6px;
  margin-bottom: 1.25rem;
  font-family: var(--sans);
}
.feedback.ok { background: var(--success-bg); color: var(--success-text); border: 1px solid var(--success-border); }
.feedback.bad { background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border); }

/* Nav */
.nav-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 0.5rem;
  border-top: 1px solid var(--border);
  direction: rtl;
}
.btn {
  padding: 9px 20px;
  border: 1px solid var(--border);
  border-radius: 7px;
  cursor: pointer;
  font-size: 14px;
  font-family: var(--sans);
  color: var(--text);
  background: var(--surface);
  transition: background 0.12s, border-color 0.12s;
  font-weight: 500;
}
.btn:hover:not(:disabled) { background: #f0efe9; border-color: var(--border-strong); }
.btn:disabled { opacity: 0.3; cursor: default; }
.btn.primary {
  background: var(--text);
  color: white;
  border-color: var(--text);
}
.btn.primary:hover { opacity: 0.85; }
.nav-center { font-size: 14px; color: var(--text-tertiary); font-family: var(--sans); }

/* Section divider */
.section-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 2rem 0 1.75rem;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-tertiary);
  font-family: var(--mono);
}
.section-divider::before, .section-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* Results */
.results-wrap { max-width: 560px; margin: 0 auto; text-align: right;}
.score-hero {
  text-align: center;
  padding: 3rem 1.5rem 2.5rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 1.25rem;
}
.score-hero .big-num {
  font-size: 72px;
  font-weight: 300;
  font-family: var(--mono);
  letter-spacing: -0.04em;
  line-height: 1;
  margin-bottom: 4px;
}
.score-hero .grade-badge {
  display: inline-block;
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 500;
  padding: 3px 12px;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-secondary);
  margin-bottom: 1.5rem;
}
.results-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 1.5rem;
}
.r-cell {
  background: var(--bg);
  border-radius: 6px;
  padding: 0.75rem;
  text-align: center;
}
.r-cell .rn { font-size: 22px; font-weight: 500; font-family: var(--mono); letter-spacing: -0.02em; }
.r-cell .rl { font-size: 12px; color: var(--text-tertiary); font-family: var(--sans); margin-top: 2px; }
.btn-retake {
  width: 100%;
  padding: 11px;
  border: 1px solid var(--border);
  border-radius: 7px;
  font-size: 14px;
  font-weight: 500;
  font-family: var(--sans);
  color: var(--text-secondary);
  background: transparent;
  cursor: pointer;
}
.btn-retake:hover { background: var(--bg); border-color: var(--border-strong); }

/* Review */
.review-section { margin-top: 2rem; }
.review-section h2 {
  font-size: 16px;
  color: var(--text-tertiary);
  font-weight: 500;
  font-family: var(--sans);
  margin-bottom: 1rem;
}
.review-item {
  padding: 1rem 0;
  border-bottom: 1px solid var(--border);
}
.review-item:last-child { border-bottom: none; }
.review-qnum {
  font-size: 12px;
  font-family: var(--sans);
  color: var(--text-tertiary);
  margin-bottom: 5px;
}
.review-qtext {
  font-size: 16px;
  color: var(--text);
  line-height: 1.5;
  margin-bottom: 6px;
  font-weight: 500;
}
.review-your {
  font-size: 14px;
  font-family: var(--sans);
  color: var(--danger-text);
  margin-bottom: 2px;
}
.review-correct {
  font-size: 14px;
  font-family: var(--sans);
  color: var(--success-text);
}

/* Unanswered notice */
.notice {
  font-size: 14px;
  color: var(--text-tertiary);
  font-family: var(--sans);
  padding: 8px 12px;
  border: 1px dashed var(--border);
  border-radius: 6px;
  margin-bottom: 1.5rem;
}

/* Responsive */
@media (max-width: 600px) {
  .main { padding: 1.5rem 1rem 3rem; }
  .site-header { padding: 0 1rem; }
  .q-text { font-size: 16px; }
  .header-stat { display: none; }
  .results-grid, .stat-row { grid-template-columns: 1fr 1fr; }
}
</style>
</head>

  "Q101": "تعتبر طباعة الفلكسوغرافيا شكلاً متطوراً من أشكال الطباعة البارزة (Letterpress). تعتمد فكرتها الأساسية على استخدام لوح طباعي مرن (مصنوع عادة من البوليمر الضوئي أو المطاط) يحمل تصميماً بارزاً. يتم نقل الحبر السائل السريع الجفاف إلى الأجزاء البارزة من اللوح عبر أسطوانة متخصصة تسمى (الأنيلوكس). ثم يقوم اللوح بنقل الحبر مباشرة إلى الخامة الطباعية (الورق، البلاستيك، الكرتون المضلع) تحت ضغط خفيف يُعرف بـ Kiss Impression. تمتاز هذه الطريقة بقدرتها على الطباعة على مجموعة واسعة جداً من الخامات المسامية وغير المسامية، وهي الطريقة المهيمنة في صناعة التعبئة والتغليف.",
  "Q102": "أسطوانة الأنيلوكس (Anilox Roller) هي 'قلب' وحدة الطباعة الفلكسوغرافية. هي عبارة عن أسطوانة معدنية مغطاة بطبقة صلبة من السيراميك (أو الكروم قديماً) ومحفورة بالليزر لتحتوي على ملايين الخلايا المجهرية الدقيقة (Microscopic Cells) على سطحها. وظيفتها الأساسية هي سحب الحبر من الحوض، ثم يتم كشط الحبر الزائد من سطحها بواسطة شفرة (Doctor Blade) بحيث يتبقى الحبر داخل الخلايا فقط. بعد ذلك، تقوم الأسطوانة بنقل كمية دقيقة وثابتة ومحسوبة من الحبر إلى الأجزاء البارزة من اللوح الطباعي، مما يضمن تجانساً لونياً دقيقاً طوال عملية التشغيل.",

  "Q104": "تتكون وحدة الطباعة النمطية للفلكسو في الأنظمة الحديثة المزودة بغرفة مغلقة (Chambered Doctor Blade) من ثلاث مكونات رئيسية: 1. أسطوانة الأنيلوكس مع غرفة الحبر المغلقة: لتزويد اللوح بكمية حبر دقيقة، 2. أسطوانة اللوح الطباعي (Plate Cylinder): التي يُثبت عليها لوح البوليمر المرن بواسطة شريط لاصق مزدوج (Mounting Tape)، 3. أسطوانة الضغط (Impression Cylinder): وهي أسطوانة معدنية ملساء تدعم الخامة من الخلف وتوفر الضغط المناسب لنقل الحبر من اللوح إلى الخامة.",
  "Q105": "زيادة حجم النقطة (Dot Gain) هو عيب طباعي متمثل في طباعة نقطة الحبر بحجم أكبر من حجمها الفعلي في اللوح، مما يؤدي إلى صورة أغمق وفقدان التفاصيل. أسبابه الرئيسية في الفلكسو هي: 1. الضغط الزائد بين اللوح وأسطوانة الضغط، 2. الضغط الزائد بين الأنيلوكس واللوح، 3. استخدام أحبار خفيفة جداً أو ذات لزوجة خاطئة، 4. مرونة اللوح الطباعي بحد ذاتها (التي تتمدد تحت الضغط). يتم تعويضه (Compensation) أثناء مرحلة ما قبل الطباعة (Prepress) بتقليل حجم النقاط في التصميم الرقمي بنسبة مدروسة (منحنى التعويض Dot Gain Curve) بحيث تعطي الحجم الصحيح عند الطباعة.",
  "Q106": "يحدث تشوه أو استطالة اللوح (Plate Distortion) في الفلكسو لأن لوح البوليمر المرن يتم صناعته وتصويره وهو مسطح (Flat)، ولكن عند لفه حول أسطوانة الطباعة الدائرية، يتمدد السطح الخارجي للوح (الذي يحمل الصورة الطباعية) بينما ينكمش السطح الداخلي. هذا التمدد يؤدي إلى استطالة الصورة المطبوعة في اتجاه دوران الأسطوانة. يتم معالجة هذه المشكلة عن طريق ضغط الصورة (تقليل أبعادها في اتجاه الدوران فقط) أثناء مرحلة ما قبل الطباعة أو التصميم، باستخدام برامج متخصصة تحسب نسبة التشوه بناءً على سمك اللوح وقطر الأسطوانة.",
  "Q107": "طباعة الـ (CI - Central Impression) هي ماكينة فلكسو تعتمد على أسطوانة ضغط مركزية واحدة وكبيرة جداً تدور حولها جميع وحدات الطباعة (التي قد تصل إلى 8 أو 10 ألوان). الميزة الجوهرية لهذا التصميم هي 'دقة التطابق اللوني الفائقة' (Excellent Registration). نظراً لأن الخامة تُمسك بقوة وتلتف حول الأسطوانة المركزية المبردة وتتحرك معها كوحدة واحدة دون أن تتعرض للشد الميكانيكي المستقل بين كل لون وآخر، فإن هذه الماكينات تعتبر مثالية للطباعة على الخامات المرنة جداً والقابلة للتمدد، مثل أفلام البولي إيثيلين الرقيقة في التغليف المرن.",
  "Q108": "الأحبار القائمة على المذيبات (Solvent-based Inks) تجف بسرعة عالية جداً عن طريق تبخر المذيبات العضوية، ولديها قدرة ممتازة على الالتصاق بالأسطح البلاستيكية غير المسامية، لكنها تطلق انبعاثات ضارة (VOCs) تتطلب أنظمة سحب وحرق مكلفة لحماية البيئة وأمان العمال. أما الأحبار المائية (Water-based Inks) فتستخدم الماء كمذيب رئيسي، وهي آمنة بيئياً وصديقة للصحة وتُستخدم بكثرة مع الخامات المسامية كالورق والكرتون، لكنها أبطأ في الجفاف على البلاستيك. أما أحبار الأشعة فوق البنفسجية (UV Inks) فلا تحتوي على مذيبات (100% صلبة)، بل تتصلد فوراً عند تعرضها للأشعة فوق البنفسجية، وتوفر جودة عالية وثباتاً ولمعاناً فائقاً، وتستخدم بكثرة في قطاع الملصقات (Labels).",
  "Q109": "طبيب الشفرة (Doctor Blade) هو شفرة معدنية أو بلاستيكية رقيقة تلامس أسطوانة الأنيلوكس بزاوية معينة (غالباً بوضع القطع العكسي Reverse angle). وظيفته الأساسية هي قشط وإزالة أي حبر زائد من على سطح أسطوانة الأنيلوكس الخارجية، وترك الحبر فقط داخل الخلايا الغائرة للأسطوانة. هذا يضمن أن الكمية المنقولة إلى اللوح الطباعي هي كمية دقيقة جداً ومحكومة فقط بحجم وعمق خلايا الأنيلوكس، مما يوفر تجانساً لونياً ثابتاً لا يتأثر بسرعة الماكينة أو بلزوجة الحبر بشكل مباشر.",
  "Q110": "عملية النقش المباشر بالليزر (Direct Laser Engraving - DLE) أو الـ CTP للفلكسو تختلف تماماً عن الطريقة التقليدية (التصوير التناظري بالفيلم السلبي والأشعة فوق البنفسجية والغسيل بالمذيبات). في الـ CTP، يُغطى لوح البوليمر بطبقة كربونية سوداء (Mask). يقوم الليزر بحرق هذه الطبقة السوداء في المناطق الطباعية فقط (تكوين صورة إيجابية). ثم يُعرض اللوح للأشعة فوق البنفسجية التي تعبر من الأماكن المحروقة لتصليد البوليمر تحتها، يلي ذلك عملية غسيل وتجفيف. في أنظمة DLE الأكثر تقدماً (النقش ثلاثي الأبعاد المباشر)، يقوم ليزر قوي بنحت وحرق المطاط أو البوليمر المجهز مباشرة لإزالة الأجزاء غير الطباعية تماماً في خطوة واحدة، دون الحاجة إلى تعريض أو غسيل أو تجفيف، مما يسرع العملية ويزيد الدقة.",
  "Q111": "معالجة الكورونا (Corona Treatment) هي عملية تفريغ كهربائي عالي الجهد يتم تطبيقها على سطح الأفلام البلاستيكية الرقيقة قبل دخولها إلى وحدات الطباعة. البلاستيك مثل (PE و PP) بطبيعته ذو توتر سطحي منخفض وخامل كيميائياً، مما يجعل من الصعب على الحبر الالتصاق به. تفريغ الكورونا يقوم بأكسدة وتخديش سطح الفيلم على المستوى الجزيئي، مما يرفع من طاقته أو توتره السطحي (Surface Tension)، فيسمح لقطرات الحبر بالانتشار والالتصاق القوي بسطح البلاستيك وتجنب تقشر الحبر بعد الجفاف.",
  "Q112": "الـ 'شريط اللاصق المزدوج' (Mounting Tape) في الفلكسو لا يقتصر دوره على تثبيت اللوح على الأسطوانة فحسب، بل يلعب دوراً ميكانيكياً حاسماً. يتوفر الشريط بدرجات صلابة مختلفة (أشرطة صلبة، متوسطة، إسفنجية/ناعمة). الأشرطة الصلبة تُستخدم لطباعة 'الأرضيات' (Solids) المليئة بالحبر لأنها توفر ضغطاً كافياً لنقل الحبر بكثافة عالية دون ترك فراغات. الأشرطة الناعمة (Cushion tapes) تُستخدم لطباعة 'الشبكات والتفاصيل الدقيقة' (Halftones) لأنها تعمل كممتص للصدمات (Cushion)، فتقلل الضغط المباشر على النقاط الدقيقة وتمنع زيادة حجم النقطة (Dot Gain) المفرط، مما يوفر دقة عالية.",
  "Q113": "عند طباعة ألوان متعددة تعتمد على زوايا شبكية (CMYK)، إذا تم اختيار زوايا غير صحيحة أو إذا حدثت إزاحة ميكانيكية، تتقاطع خطوط النقاط وتتداخل الألوان بشكل غير متناسق لتُنتج نمطاً بصرياً متكرراً ومزعجاً للعين يشبه النسيج المتموج، وهذا ما يسمى بتأثير 'المواريه' (Moiré). لتجنب ذلك في الفلكسو، يجب ضبط زوايا الشبكات بدقة، بحيث يكون هناك فارق 30 درجة بين الألوان القوية (عادة الأسود 45، الماجنتا 75، السماوي 15) ووضع اللون الأصفر (الأقل وضوحاً) عند زاوية 90 أو 0 درجة. كما يراعى استخدام أسطوانة أنيلوكس بزاوية 60 درجة وبكثافة خطوط تفوق كثافة اللوح بـ 5-6 مرات لمنع التداخل بين خلايا الأنيلوكس وشبكة اللوح.",
  "Q114": "في أحبار الفلكسو المائية، ترتبط اللزوجة ودرجة الـ pH (الأس الهيدروجيني) ارتباطاً وثيقاً. لكي تبقى الراتنجات (الوسيط الرابط) في حالة سائلة ومذابة في الماء، يجب إبقاء الحبر في بيئة قلوية (عادة pH من 8.5 إلى 9.5) باستخدام الأمينات أو الأمونيا المضافة. إذا تطايرت الأمونيا أثناء التشغيل وانخفض الـ pH، ستبدأ الراتنجات في التخثر (الانفصال) وسترتفع اللزوجة بشكل ملحوظ، مما يؤدي إلى جفاف الحبر داخل خلايا الأنيلوكس وعلى اللوح، وتصبح الطباعة غير نظيفة. لذلك يجب قياس وضبط الـ pH أولاً قبل إضافة الماء لتخفيف اللزوجة.",
  "Q115": "أهم إجراءات الأمن والسلامة في مطابع الفلكسو (خاصة التي تستخدم الأحبار المذيبة) تشمل: 1. التهوية الجيدة: استخدام أنظمة سحب هواء (Exhaust) للتخلص من أبخرة المذيبات (VOCs) السامة والمانعة للاختناق. 2. مكافحة الحرائق: بما أن المذيبات شديدة الاشتعال، يجب إبعاد مصادر اللهب المفتوح (No Smoking/No Open Flames)، وتأريض جميع المعدات (Grounding) لتفريغ الكهرباء الاستاتيكية التي قد تسبب شرارة. 3. معدات الوقاية الشخصية (PPE): ارتداء القفازات والنظارات الواقية للتعامل مع الكيماويات والمذيبات، وارتداء سدادات الأذن (Earplugs) للوقاية من الضوضاء العالية الناتجة عن الماكينات والمجففات. 4. التخزين الآمن: تخزين الأحبار والمذيبات في غرف مقاومة للحريق ومعزولة."

let state = { screen: 'start', mode: 'exam', current: 0, answers: {}, submitted: false };

function $(id) { return document.getElementById(id); }
function app() { return $('app'); }

function updateHeader() {
  const stat = $('hdr-stat');
  if (state.screen === 'exam') {
    const answered = Object.keys(state.answers).filter(k => state.answers[k].toString().trim() !== '').length;
    stat.innerHTML = `<span>${answered}</span> / ${QUESTIONS.length} مجاب`;
  } else if (state.screen === 'results') {
    stat.innerHTML = 'النتائج';
  } else {
    stat.innerHTML = '—';
  }
}

function render() {
  updateHeader();
  if (state.screen === 'start') renderStart();
  else if (state.screen === 'exam') renderExam();
  else if (state.screen === 'results') renderResults();
}

function renderStart() {
  const total = QUESTIONS.length;
  const totalMcq = QUESTIONS.filter(q => q.type === 'mcq').length;
  const totalEssay = QUESTIONS.filter(q => q.type === 'essay').length;

  app().innerHTML = `
    <div class="start-screen">
      <h1>ترميم المطبوعات<br>بنك الأسئلة</h1>
      <div class="stat-row">
        <div class="stat-cell"><span class="num">${totalMcq}</span><span class="lbl">اختيار متعدد</span></div>
        <div class="stat-cell"><span class="num">${totalEssay}</span><span class="lbl">مقالي</span></div>
        <div class="stat-cell total"><span class="num">${total}</span><span class="lbl">المجموع</span></div>
      </div>
      <div class="mode-cards">
        <div class="mode-card ${state.mode==='exam'?'active':''}" onclick="setMode('exam')">
          <div class="mode-icon">[ ]</div>
          <div class="mode-title">وضع الامتحان</div>
          <div class="mode-desc">أجب على جميع الأسئلة ثم قم بالتسليم لرؤية النتيجة.</div>
        </div>
        <div class="mode-card ${state.mode==='practice'?'active':''}" onclick="setMode('practice')">
          <div class="mode-icon">[✓]</div>
          <div class="mode-title">وضع التدريب</div>
          <div class="mode-desc">ملاحظات فورية وإجابات نموذجية بعد كل سؤال.</div>
        </div>
      </div>
      <button class="btn-start" onclick="startExam()">البدء ←</button>
    </div>`;
}

function setMode(m) {
  state.mode = m;
  renderStart();
}

function startExam() {
  state.screen = 'exam';
  state.current = 0;
  state.answers = {};
  render();
}

function renderExam() {
  const q = QUESTIONS[state.current];
  const answered = state.answers[q.id] !== undefined && state.answers[q.id].toString().trim() !== '';
  const correct = ANSWERS[q.id];
  const userAns = state.answers[q.id];
  const showFeedback = state.mode === 'practice' && answered;
  const total = QUESTIONS.length;
  const answeredCount = Object.keys(state.answers).filter(k => state.answers[k].toString().trim() !== '').length;
  const isLast = state.current === total - 1;
  const allAnswered = answeredCount === total;

  // Progress dots
  let dots = '<div class="progress-track">';
  for (let i = 0; i < total; i++) {
    const dq = QUESTIONS[i];
    let cls = 'p-dot';
    if (i === state.current) cls += ' current';
    else if (state.answers[dq.id] !== undefined && state.answers[dq.id].toString().trim() !== '') {
      if (state.mode === 'practice' && dq.type !== 'essay') {
        cls += state.answers[dq.id] === ANSWERS[dq.id] ? ' ok' : ' bad';
      } else {
        cls += ' skipped';
      }
    }
    dots += `<div class="${cls}" title="سؤال ${i+1}" onclick="jumpTo(${i})"></div>`;
  }
  dots += '</div>';

  // Options
  let optHtml = '';
  if (q.type === 'mcq') {
    optHtml = '<div class="options">';
    for (const [k, v] of Object.entries(q.options)) {
      let cls = 'option';
      if (answered && state.mode === 'practice') {
        cls += ' locked';
        if (showFeedback) {
          if (k === correct) cls += ' correct';
          else if (k === userAns) cls += ' wrong';
        }
      } else {
        if (k === userAns) cls += ' selected';
      }
      optHtml += `<button class="${cls}" onclick="doAnswer('${q.id}','${k}')" ${answered && state.mode==='practice' ? 'disabled' : ''}>
        <span class="opt-key">${k}</span><span>${v}</span>
      </button>`;
    }
    optHtml += '</div>';
  } else if (q.type === 'essay') {
      const val = state.answers[q.id] || '';
      const isLocked = (state.mode === 'practice' && answered) ? 'readonly' : '';
      optHtml = `<textarea class="option textarea-essay" rows="5" placeholder="اكتب إجابتك هنا..." onchange="doAnswer('${q.id}', this.value, true)" ${isLocked}>${val}</textarea>`;
      if (showFeedback) {
         optHtml += `<div class="feedback ok">تم تسجيل الإجابة. في الامتحان العملي يتم التقييم يدوياً.</div>`;
      }
  }

  let unansweredNotice = '';
  if (state.mode === 'exam' && isLast && !allAnswered) {
    const missing = total - answeredCount;
    unansweredNotice = `<div class="notice">يوجد ${missing} سؤال غير مجاب — استخدم النقاط العلوية للرجوع والتأكد.</div>`;
  }

  let navRight = '';
  if (!isLast) {
    navRight = `<button class="btn" onclick="nextQ()">التالي ←</button>`;
  } else {
    navRight = `<button class="btn primary" onclick="submitExam()" ${state.mode==='exam'&&!allAnswered?'disabled':''}>إنهاء وتسليم</button>`;
  }

  app().innerHTML = `
    ${dots}
    <div class="q-header">
      <span class="q-num">سؤال ${state.current+1} من ${total}</span>
      <span class="q-section-badge">${q.section} · ${q.type==='mcq'?'اختيار متعدد':'سؤال مقالي'}</span>
    </div>
    <div class="q-text">${q.text}</div>
    ${optHtml}
    ${unansweredNotice}
    <div class="nav-row">
      ${navRight}
      <span class="nav-center">${answeredCount} / ${total}</span>
      <button class="btn" onclick="prevQ()" ${state.current===0?'disabled':''}>→ السابق</button>
    </div>`;
}

function doAnswer(id, val, isEssay = false) {
  if (state.mode === 'practice' && state.answers[id] !== undefined && !isEssay) return;
  state.answers[id] = val;
  if (isEssay) {
      updateHeader();
      // Do not re-render immediately for essays to prevent losing focus
  } else {
      render();
  }
}

function nextQ() { if (state.current < QUESTIONS.length - 1) { state.current++; render(); } }
function prevQ() { if (state.current > 0) { state.current--; render(); } }
function jumpTo(i) { state.current = i; render(); }

function submitExam() {
  state.screen = 'results';
  render();
}

function renderResults() {
  let correct = 0, mcqC = 0, essayC = 0;
  QUESTIONS.forEach(q => {
    if (q.type === 'essay') {
        if (state.answers[q.id] && state.answers[q.id].trim().length > 0) {
            correct++; // Mark essay as "complete" for stat purposes
            essayC++;
        }
    } else {
        if (state.answers[q.id] === ANSWERS[q.id]) {
            correct++;
            mcqC++;
        }
    }
  });

  const total = QUESTIONS.length;
  const totalMcq = QUESTIONS.filter(q => q.type === 'mcq').length;
  const totalEssay = QUESTIONS.filter(q => q.type === 'essay').length;
  const pct = Math.round((correct / total) * 100);
  const grade = pct>=90?'امتياز':pct>=80?'جيد جداً':pct>=70?'جيد':pct>=60?'مقبول':'ضعيف';

  let reviewHtml = '';
  QUESTIONS.forEach((q, i) => {
    const isEssay = q.type === 'essay';
    const ok = isEssay ? (state.answers[q.id] && state.answers[q.id].trim() !== '') : (state.answers[q.id] === ANSWERS[q.id]);

    if (!ok) {
      const ca = ANSWERS[q.id];
      let correctText = '';
      if (q.type === 'mcq') correctText = `${ca}) ${q.options[ca]}`;
      else correctText = 'تم ترك السؤال المقالي فارغاً.';

      let yourText = '';
      if (state.answers[q.id] !== undefined && state.answers[q.id].trim() !== '') {
        if (q.type === 'mcq') yourText = `${state.answers[q.id]}) ${q.options[state.answers[q.id]]}`;
        else yourText = state.answers[q.id];
      } else {
        yourText = 'لم يتم الإجابة';
      }
      reviewHtml += `<div class="review-item">
        <div class="review-qnum">سؤال ${i+1} · ${q.section}</div>
        <div class="review-qtext">${q.text}</div>
        <div class="review-your">✗ إجابتك: ${yourText}</div>
        ${q.type === 'mcq' ? `<div class="review-correct">✓ الصحيح: ${correctText}</div>` : ''}
      </div>`;
    }
  });

  app().innerHTML = `
    <div class="results-wrap">
      <div class="score-hero">
        <div class="big-num">${pct}%</div>
        <div class="grade-badge">التقدير: ${grade}</div>
        <div class="results-grid">
          <div class="r-cell"><div class="rn">${correct}<span style="font-size:14px;color:var(--text-tertiary)">/${total}</span></div><div class="rl">نقاط صحيحة/مكتملة</div></div>
          <div class="r-cell"><div class="rn">${mcqC}<span style="font-size:14px;color:var(--text-tertiary)">/${totalMcq}</span></div><div class="rl">اختيار متعدد</div></div>
          <div class="r-cell"><div class="rn">${essayC}<span style="font-size:14px;color:var(--text-tertiary)">/${totalEssay}</span></div><div class="rl">مقالي (مكتمل)</div></div>
        </div>
        <button class="btn-retake" onclick="goHome()">← إعادة الامتحان</button>
      </div>
      ${reviewHtml ? `<div class="review-section"><h2>إجابات خاطئة أو متروكة (${total-correct})</h2>${reviewHtml}</div>` : '<div style="text-align:center;padding:2rem;font-family:var(--sans);font-size:16px;color:var(--text-tertiary);">أداء ممتاز — جميع الأسئلة صحيحة ومكتملة.</div>'}
    </div>`;
}

function goHome() {
  state = { screen: 'start', mode: state.mode, current: 0, answers: {}, submitted: false };
  render();
}

render();
</script>
</body>
</html>
